<div class="p-6 bg-slate-50 min-h-screen">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-slate-800">Gestion des Groupes de Service</h1>
    <button (click)="openNew()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 shadow flex items-center gap-2">
      <span class="material-icons text-sm">add</span> Nouveau Groupe
    </button>
  </div>

  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead class="bg-slate-100 text-slate-600 uppercase text-xs font-bold">
        <tr>
          <th class="p-4">Nom du Groupe</th>
          <th class="p-4">Membres</th>
          <th class="p-4">Services</th>
          <th class="p-4 text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let g of groupes" class="border-t hover:bg-slate-50 transition">
          <td class="p-4 font-bold text-slate-700">{{ g.nom }}</td>
          <td class="p-4 text-slate-600">{{ getServeurNames(g.serveurIds) }}</td>
          <td class="p-4">
            <span *ngFor="let s of g.services" class="inline-block bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded mr-1">
              {{ s }}
            </span>
          </td>
          <td class="p-4 text-right">
            <button (click)="openEdit(g)" class="text-blue-600 hover:text-blue-800 mr-3">Éditer</button>
            <button (click)="deleteGroupe(g.id)" class="text-red-600 hover:text-red-800">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="showModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 backdrop-blur-sm p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
      <div class="bg-slate-100 p-4 border-b flex justify-between items-center">
        <h3 class="font-bold text-lg">{{ isEditing ? 'Modifier' : 'Créer' }} un Groupe</h3>
        <button (click)="showModal = false" class="text-slate-400 hover:text-red-500">✕</button>
      </div>
      
      <form [formGroup]="groupeForm" (ngSubmit)="saveGroupe()" class="p-6 space-y-4">
        
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Nom du Groupe</label>
          <input formControlName="nom" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: Équipe Mariage">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Sélectionner les Serveurs</label>
          <div class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto border p-2 rounded bg-slate-50">
            <label *ngFor="let s of serveursDisponibles" class="flex items-center space-x-2 cursor-pointer hover:bg-white p-1 rounded">
              <input type="checkbox" [value]="s.id" [checked]="isChecked(s.id, 'serveur')" (change)="onCheckChange($event, 'serveur')" class="rounded text-blue-600">
              <span class="text-sm">{{ s.nom }}</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">Sélectionner les Services</label>
          <div class="grid grid-cols-2 gap-2 border p-2 rounded bg-slate-50">
            <label *ngFor="let svc of servicesDisponibles" class="flex items-center space-x-2 cursor-pointer hover:bg-white p-1 rounded">
              <input type="checkbox" [value]="svc" [checked]="isChecked(svc, 'service')" (change)="onCheckChange($event, 'service')" class="rounded text-emerald-600">
              <span class="text-sm">{{ svc }}</span>
            </label>
          </div>
        </div>

        <button type="submit" [disabled]="groupeForm.invalid" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg mt-4 disabled:opacity-50">
          Enregistrer le Groupe
        </button>
      </form>
    </div>
  </div>
</div>
