<div class="chat-page">
  <div class="chat-header">
    <h2>Chat Admin</h2>
    <div class="hint" *ngIf="!isAdmin">Lecture seule (Admin = admin@gmail.com)</div>
  </div>

  <div class="chat-box">
    <div class="msg" *ngFor="let m of messages">
      <div class="meta">
        <span class="from">{{ m.fromEmail }}</span>
        <span class="time" *ngIf="m.createdAt?.toDate">{{ m.createdAt.toDate() | date:'short' }}</span>
      </div>
      <div class="text">{{ m.text }}</div>
    </div>
  </div>

  <div class="composer" *ngIf="isAdmin">
    <input
      type="text"
      [(ngModel)]="text"
      placeholder="Écrire un message à tous les utilisateurs…"
      (keyup.enter)="send()"
      [disabled]="sending"
    />
    <button (click)="send()" [disabled]="sending || !text.trim()">Envoyer</button>
  </div>
</div>
