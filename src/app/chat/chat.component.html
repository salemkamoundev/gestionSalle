<div class="flex flex-col h-[500px] w-full max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
  
  <div class="bg-slate-900 p-4 flex items-center gap-3 shadow-md">
    <div class="relative">
      <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white">
        <span class="material-icons">support_agent</span>
      </div>
      <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></div>
    </div>
    <div>
      <h3 class="font-bold text-white text-sm">Support Administration</h3>
      <p class="text-xs text-slate-400">Réponse généralement sous 1h</p>
    </div>
  </div>

  <div #scrollContainer class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar bg-slate-50">
    @for (msg of messages(); track msg.id) {
      <div class="flex w-full" [ngClass]="msg.senderId !== 'ADMIN' ? 'justify-end' : 'justify-start'">
        
        <div class="max-w-[80%] flex flex-col" [ngClass]="msg.senderId !== 'ADMIN' ? 'items-end' : 'items-start'">
          <div class="px-3 py-2 rounded-xl text-sm shadow-sm"
               [ngClass]="msg.senderId !== 'ADMIN' 
                  ? 'bg-blue-600 text-white rounded-tr-none' 
                  : 'bg-white text-slate-700 border border-slate-200 rounded-tl-none'">
            {{ msg.text }}
          </div>
          
          <div class="flex items-center gap-1 mt-1 text-[9px] text-slate-400">
             <span>{{ formatTime(msg.createdAt) }}</span>
             @if (msg.senderId !== 'ADMIN') {
               <span class="material-icons text-[10px]" [ngClass]="msg.read ? 'text-blue-500' : 'text-slate-300'">done_all</span>
             }
          </div>
        </div>

      </div>
    }
    @if (messages().length === 0) {
      <div class="text-center text-slate-400 text-xs mt-10">
        Envoyez un message pour commencer la discussion.
      </div>
    }
  </div>

  <div class="p-3 bg-white border-t border-slate-100">
    <form (submit)="sendMessage()" class="relative">
      <input type="text" [(ngModel)]="newMessage" name="msg" 
             placeholder="Votre message..." 
             class="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50"
             autocomplete="off">
      <button type="submit" [disabled]="!newMessage.trim()" 
              class="absolute right-2 top-1/2 -translate-y-1/2 text-blue-600 hover:text-blue-700 disabled:text-slate-300 transition p-1">
        <span class="material-icons">send</span>
      </button>
    </form>
  </div>
</div>
