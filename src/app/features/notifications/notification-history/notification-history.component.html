<div class="p-6 max-w-4xl mx-auto space-y-6 animate-fade-in">
  
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold text-slate-800 flex items-center gap-2">
        <span class="material-icons text-purple-600">notifications</span>
        Vos Notifications
      </h1>
      <p class="text-slate-500 mt-1">Historique de vos alertes et messages</p>
    </div>
    
    <button (click)="markAllRead()" 
            *ngIf="(unreadCount$ | async)! > 0"
            class="px-4 py-2 bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 transition font-medium text-sm flex items-center gap-2">
      <span class="material-icons text-sm">done_all</span> Tout marquer comme lu
    </button>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <ng-container *ngIf="notifications$ | async as list">
      
      <div *ngIf="list.length === 0" class="p-10 text-center text-slate-500">
        <span class="material-icons text-5xl text-slate-300 mb-2">notifications_off</span>
        <p>Aucune notification pour le moment.</p>
      </div>

      <ul class="divide-y divide-slate-100">
        <li *ngFor="let notif of list" 
            [class.bg-purple-50]="!notif.read"
            class="p-4 hover:bg-slate-50 transition flex gap-4 group cursor-pointer relative"
            (click)="markAsRead(notif)">
          
          <div [ngClass]="{
            'bg-blue-100 text-blue-600': notif.type === 'info' || !notif.type,
            'bg-green-100 text-green-600': notif.type === 'success',
            'bg-amber-100 text-amber-600': notif.type === 'warning',
            'bg-red-100 text-red-600': notif.type === 'error'
          }" class="w-10 h-10 rounded-full flex items-center justify-center shrink-0">
            <span class="material-icons text-xl">{{ notif.icon || 'notifications' }}</span>
          </div>

          <div class="flex-1">
            <div class="flex justify-between items-start">
              <h3 class="font-bold text-slate-800" [class.text-purple-700]="!notif.read">{{ notif.title }}</h3>
              <span class="text-xs text-slate-400 whitespace-nowrap">{{ notif.createdAt.toDate() | date:'dd/MM/yyyy HH:mm' }}</span>
            </div>
            <p class="text-slate-600 text-sm mt-1">{{ notif.body }}</p>
            
            <a *ngIf="notif.link" [routerLink]="notif.link" class="inline-block mt-2 text-xs font-semibold text-purple-600 hover:text-purple-800">
              Voir les détails &rarr;
            </a>
          </div>

          <div *ngIf="!notif.read" class="absolute top-4 right-4 w-2 h-2 rounded-full bg-red-500"></div>
        </li>
      </ul>
    </ng-container>
  </div>
</div>
