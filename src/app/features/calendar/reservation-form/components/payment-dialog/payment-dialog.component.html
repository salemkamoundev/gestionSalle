<h2 mat-dialog-title>Règlement</h2>
<div mat-dialog-content>
  <div class="summary-box">
    <div class="row"><span>Total:</span> <strong>{{ reservation.totalPrice | number }} TND</strong></div>
    <div class="row"><span>Avance:</span> <span>{{ totalPaid | number }} TND</span></div>
    <div class="row total"><span>Reste:</span> <span>{{ remaining | number }} TND</span></div>
  </div>
  <form [formGroup]="paymentForm">
    <div class="grid-2">
      <mat-form-field appearance="outline" class="full-width"><mat-label>Montant</mat-label><input matInput type="number" formControlName="amount"></mat-form-field>
      <mat-form-field appearance="outline" class="full-width"><mat-label>Type</mat-label>
        <mat-select formControlName="type"><mat-option value="ESPECES">Espèces</mat-option><mat-option value="CHEQUE">Chèque</mat-option><mat-option value="VIREMENT">Virement</mat-option></mat-select>
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline" class="full-width"><mat-label>Date</mat-label><input matInput [matDatepicker]="d" formControlName="date"><mat-datepicker-toggle matSuffix [for]="d"></mat-datepicker-toggle><mat-datepicker #d></mat-datepicker></mat-form-field>
    <div *ngIf="paymentForm.get('type')?.value === 'CHEQUE'" class="grid-2">
      <mat-form-field appearance="outline" class="full-width"><mat-label>N° Chèque</mat-label><input matInput formControlName="checkNumber"></mat-form-field>
      <mat-form-field appearance="outline" class="full-width"><mat-label>Échéance</mat-label><input matInput [matDatepicker]="c" formControlName="checkDate"><mat-datepicker-toggle matSuffix [for]="c"></mat-datepicker-toggle><mat-datepicker #c></mat-datepicker></mat-form-field>
    </div>
  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close()">Annuler</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="paymentForm.invalid || isProcessing">Valider</button>
</div>
