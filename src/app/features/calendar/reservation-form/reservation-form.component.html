<div class="bg-white p-6 rounded-lg shadow-xl relative">
  
  <div class="flex justify-between items-start mb-4">
    <h3 class="font-bold text-lg">Nouveau Client</h3>
    <button type="button" (click)="onClose()" class="text-slate-400 hover:text-slate-600 p-1 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <form [formGroup]="clientForm" (ngSubmit)="onSubmit()">
    
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">Nom *</label>
        <input formControlName="nom" class="w-full px-3 py-2 border rounded-lg uppercase" type="text">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">Prénom *</label>
        <input formControlName="prenom" class="w-full px-3 py-2 border rounded-lg capitalize" type="text">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">CIN</label>
        <input formControlName="cin" class="w-full px-3 py-2 border rounded-lg" type="text">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">Date CIN</label>
        <input formControlName="dateCin" type="date" class="w-full px-3 py-2 border rounded-lg">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">Téléphone *</label>
        <input formControlName="telephone" type="tel" class="w-full px-3 py-2 border rounded-lg">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">Email</label>
        <input formControlName="email" type="email" class="w-full px-3 py-2 border rounded-lg">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">Marié(e) 1</label>
        <input formControlName="prenomMarie1" class="w-full px-3 py-2 border rounded-lg" type="text">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1">Marié(e) 2</label>
        <input formControlName="prenomMarie2" class="w-full px-3 py-2 border rounded-lg" type="text">
      </div>
    </div>

    <div class="flex gap-3 mt-6">
      <button type="button" 
              (click)="onClose()"
              class="w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-lg transition-colors">
        Annuler
      </button>

      <button type="submit" 
              [disabled]="clientForm.invalid" 
              class="w-2/3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        Enregistrer Client
      </button>
    </div>

  </form>
</div>
