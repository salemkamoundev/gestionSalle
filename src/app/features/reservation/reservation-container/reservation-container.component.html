<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  
  <div class="mb-8">
    <h2 class="text-3xl font-bold text-gray-900">Gestion de la Réservation</h2>
    <p class="mt-2 text-sm text-gray-600">Gérez les détails du client, de l'événement et de la facturation.</p>
  </div>

  <div class="border-b border-gray-200 mb-6">
    <nav class="-mb-px flex space-x-8 overflow-x-auto" aria-label="Tabs">
      <button
        *ngFor="let tab of tabs"
        (click)="selectTab(tab.id)"
        [class.border-indigo-500]="activeTab === tab.id"
        [class.text-indigo-600]="activeTab === tab.id"
        [class.border-transparent]="activeTab !== tab.id"
        [class.text-gray-500]="activeTab !== tab.id"
        [class.hover:text-gray-700]="activeTab !== tab.id"
        [class.hover:border-gray-300]="activeTab !== tab.id"
        class="group inline-flex items-center py-4 px-1 border-b-2 font-medium text-sm transition-colors duration-200 whitespace-nowrap focus:outline-none"
      >
        <span class="material-icons mr-2 text-lg" 
              [class.text-indigo-500]="activeTab === tab.id"
              [class.text-gray-400]="activeTab !== tab.id"
              [class.group-hover:text-gray-500]="activeTab !== tab.id">
          {{ tab.icon }}
        </span>
        {{ tab.label }}
      </button>
    </nav>
  </div>

  <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 min-h-[500px]">
    
    <div *ngIf="activeTab === 'client'" class="animate-fade">
      <app-client-info></app-client-info>
    </div>

    <div *ngIf="activeTab === 'event'" class="animate-fade">
      <app-event-details></app-event-details>
    </div>

    <div *ngIf="activeTab === 'packs'" class="animate-fade">
      <app-services-packs></app-services-packs>
    </div>

    <div *ngIf="activeTab === 'staff'" class="animate-fade">
      <app-staff-teams></app-staff-teams>
    </div>

    <div *ngIf="activeTab === 'payment'" class="animate-fade">
      <app-payments></app-payments>
    </div>

  </div>
  
  <div class="mt-6 flex justify-end space-x-3">
    <button class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
      Annuler
    </button>
    <button class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
      Sauvegarder la réservation
    </button>
  </div>

</div>
