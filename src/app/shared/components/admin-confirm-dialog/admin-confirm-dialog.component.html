<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md animate-fade-in overflow-hidden border border-red-100">
    
    <div class="bg-red-50 p-6 border-b border-red-100 flex items-center">
      <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center mr-4 text-red-600">
        <span class="material-icons">security</span>
      </div>
      <div>
        <h3 class="text-lg font-black text-red-900">Confirmation Requise</h3>
        <p class="text-sm text-red-700">Action sensible : Suppression</p>
      </div>
    </div>

    <div class="p-6">
      <p class="text-slate-600 mb-4 text-sm">
        Pour supprimer cette réservation, veuillez confirmer votre identité en saisissant le mot de passe de <strong>admin@gmail.com</strong>.
      </p>

      <div class="space-y-2">
        <label class="text-xs font-bold text-slate-500 uppercase">Mot de passe Admin</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          (keyup.enter)="confirm()"
          placeholder="••••••••"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition"
          [class.border-red-500]="errorMessage()"
        >
        <p *ngIf="errorMessage()" class="text-xs text-red-600 font-bold flex items-center mt-1">
          <span class="material-icons text-[14px] mr-1">error</span> {{ errorMessage() }}
        </p>
      </div>
    </div>

    <div class="p-4 bg-slate-50 flex justify-end space-x-3 border-t border-slate-100">
      <button 
        (click)="cancel()" 
        class="px-4 py-2 text-slate-600 font-bold hover:bg-slate-200 rounded-lg transition text-sm">
        Annuler
      </button>
      <button 
        (click)="confirm()" 
        [disabled]="isLoading() || !password"
        class="px-6 py-2 bg-red-600 text-white font-bold rounded-lg shadow-lg shadow-red-200 hover:bg-red-700 transition transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center text-sm">
        <span *ngIf="isLoading()" class="material-icons animate-spin text-sm mr-2">refresh</span>
        {{ isLoading() ? 'Vérification...' : 'Confirmer la suppression' }}
      </button>
    </div>
  </div>
</div>
