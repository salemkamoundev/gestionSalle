<mat-sidenav-container class="sidenav-container">
  
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="'navigation'"
      mode="side"
      opened="true">
    
    <mat-toolbar color="primary">Menu</mat-toolbar>
    
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Tableau de bord</span>
      </a>

      <a mat-list-item routerLink="/calendar" routerLinkActive="active-link">
        <mat-icon matListItemIcon>calendar_today</mat-icon>
        <span matListItemTitle>Calendrier</span>
      </a>

      <a mat-list-item routerLink="/reservations" routerLinkActive="active-link">
        <mat-icon matListItemIcon>event</mat-icon>
        <span matListItemTitle>Réservations</span>
      </a>

      <a mat-list-item routerLink="/clients" routerLinkActive="active-link">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Clients</span>
      </a>

      <a mat-list-item routerLink="/staff" routerLinkActive="active-link">
        <mat-icon matListItemIcon>badge</mat-icon>
        <span matListItemTitle>Équipe / Staff</span>
      </a>
      
      <a mat-list-item routerLink="/finances" routerLinkActive="active-link">
        <mat-icon matListItemIcon>euro</mat-icon>
        <span matListItemTitle>Finances</span>
      </a>

      <mat-divider></mat-divider>

      <ng-container *ngIf="(currentUser$ | async)?.role === 'ADMIN'">
        <a mat-list-item routerLink="/config" routerLinkActive="active-link">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Configuration</span>
        </a>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    
    <mat-toolbar color="primary">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      
      <span>La Princesse - Salle des Fêtes</span>
      
      <span class="spacer"></span>

      <a mat-icon-button routerLink="/chat" class="badge-container" matTooltip="Messagerie">
        <mat-icon>chat</mat-icon>
        <span *ngIf="(unreadChatCount$ | async) as count" class="badge-red">
          {{ count > 99 ? '99+' : count }}
        </span>
      </a>

      <button mat-icon-button class="badge-container" matTooltip="Notifications">
        <mat-icon>notifications</mat-icon>
        <span *ngIf="(unreadNotifCount$ | async) as count" class="badge-red">
          {{ count > 99 ? '99+' : count }}
        </span>
      </button>

      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item disabled>
          <mat-icon>person</mat-icon>
          <span>{{ (currentUser$ | async)?.email }}</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>exit_to_app</mat-icon>
          <span>Déconnexion</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
